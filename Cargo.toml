[workspace]
members = ["crates/backup"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.97"

[workspace.dependencies]
anyhow = "1.0"
blake3 = { version = "1.8", features = ["pure"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.6", features = ["derive"] }
croner = "3.0"
ctrlc = "3.5"
directories = "6.0"
file-rotate = "0.8"
fs2 = "0.4"
humantime = "2.4"
ignore = "0.4"
lz4_flex = "0.14"
notify = "8.2"
percent-encoding = "2.3"
redb = "4.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = "0.39"
tar = "0.4"
tempfile = "3.27"
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5"
uuid = { version = "1.24", features = ["v4", "serde"] }
walkdir = "2.5"
xattr = "1.6"
